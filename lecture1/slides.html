### 1. Getting started

#### 1.3. R projects

&lt;ul&gt;
  &lt;li&gt;What is an R project?&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;An R project is simply a &lt;b&gt;folder&lt;/b&gt; tied to a &lt;b&gt;.Rproj&lt;/b&gt; file&lt;/li&gt;
    &lt;li&gt;Opening the .Rproj file &lt;b&gt;starts a fresh R session&lt;/b&gt; with the &lt;b&gt;working directory set to that folder&lt;/b&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;

--

&lt;p style = "margin-bottom:1cm;"&gt;&lt;/p&gt;

&lt;ul&gt;
  &lt;li&gt;Why bother? This is &lt;b&gt;good practice&lt;/b&gt; for anything that is not a one-off script&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;Your &lt;b&gt;scripts, data, and outputs&lt;/b&gt; stay together in one place&lt;/li&gt;
    &lt;li&gt;Your code becomes &lt;b&gt;portable&lt;/b&gt;: it will run the same way on a collaborator's computer, or on your computer in five years&lt;/li&gt;
    &lt;li&gt;You never need to use &lt;code&gt;setwd()&lt;/code&gt; with an absolute path again&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;

--

&lt;p style = "margin-bottom:1cm;"&gt;&lt;/p&gt;

&lt;center&gt;&lt;i&gt;&amp;#10140; Create a project (File &gt; New Project...) now for this course, and put today's script and data inside it&lt;/i&gt;&lt;/center&gt;

### 1. Getting started

#### 1.4. Packages

&lt;ul&gt;
  &lt;li&gt;Base R is the core of the R programming language, but packages extend its capabilities (and make your life easier!):&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;Packages are &lt;b&gt;centralized&lt;/b&gt; on the &lt;a href = "https://cran.r-project.org/"&gt;Comprehensive R Archive Network (CRAN)&lt;/a&gt;&lt;/li&gt;
    &lt;li&gt;To &lt;b&gt;download&lt;/b&gt; and install a CRAN package you can simply use &lt;b&gt;install.packages()&lt;/b&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;

--


``` r
install.packages("rio") # Requires an internet connection
```

--

&lt;ul&gt; 
  &lt;li&gt;The package is now &lt;b&gt;installed on your computer&lt;/b&gt;: you won't have to do it again&lt;/li&gt; 
  &lt;ul&gt; 
    &lt;li&gt;But it is &lt;b&gt;not loaded in R yet&lt;/b&gt;: each time you start a &lt;b&gt;new R session&lt;/b&gt;, you'll have to load the packages you need with &lt;b&gt;library()&lt;/b&gt;&lt;/li&gt; 
  &lt;/ul&gt; 
&lt;/ul&gt;

--

``` r
library(rio)
```

&lt;ul&gt; 
  &lt;li&gt;You can also use a package's functions without fully loading the package by using the &lt;b&gt;double colon&lt;/b&gt; operator (&lt;code&gt;package::function&lt;/code&gt;)&lt;/li&gt; 
&lt;/ul&gt;

.pull-left[
&lt;ul&gt;
  &lt;li&gt;There are many ways to &lt;b&gt;import&lt;/b&gt; stuff in R, but I recommend the package &lt;code&gt;rio&lt;/code&gt;&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;It takes the &lt;b&gt;file directory&lt;/b&gt; as an &lt;b&gt;input&lt;/b&gt;&lt;/li&gt;

&lt;p style = "margin-bottom:1cm;"&gt;&lt;/p&gt;

  &lt;ul&gt;
    &lt;li&gt;The function &lt;code&gt;rio::import()&lt;/code&gt; chooses the right reader &lt;b&gt;based on the file extension&lt;/b&gt; (.csv, .xlsx, .dta, .sav, ...)&lt;/li&gt;
    &lt;li&gt;For &lt;b&gt;.csv&lt;/b&gt; files, it uses &lt;b&gt;data.table::fread()&lt;/b&gt; under the hood, which is &lt;b&gt;much faster&lt;/b&gt; than base R's reader&lt;/li&gt;

### 1. Getting started

#### 1.5. Import and eyeball data

&lt;ul&gt;
  &lt;li&gt;An &lt;b&gt;absolute path&lt;/b&gt; like &lt;code&gt;"C:/User/Documents/class/ligue1.csv"&lt;/code&gt; only works &lt;b&gt;on your computer&lt;/b&gt;&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;It &lt;b&gt;breaks&lt;/b&gt; as soon as you share your script, or move your files around&lt;/li&gt;
    &lt;li&gt;Depending on your operating system, it can also break if you use backslashes (\) instead of forward slashes (/)&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;

--

&lt;p style = "margin-bottom:1cm;"&gt;&lt;/p&gt;

&lt;ul&gt;
  &lt;li&gt;Since we are working inside an &lt;b&gt;R project&lt;/b&gt;, we can use &lt;b&gt;relative paths&lt;/b&gt; instead&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;They are defined &lt;b&gt;from the project's root folder&lt;/b&gt;, not from your computer's root&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;

--

&lt;p style = "margin-bottom:1cm;"&gt;&lt;/p&gt;

&lt;ul&gt;
  &lt;li&gt;The &lt;code&gt;here&lt;/code&gt; package makes this effortless with the &lt;b&gt;here()&lt;/b&gt; function&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;It automatically finds your &lt;b&gt;project's root&lt;/b&gt;, wherever your R script is opened from&lt;/li&gt;
    &lt;li&gt;You just describe the path to your file &lt;b&gt;from there&lt;/b&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;

--


``` r
fb &lt;- rio::import(here::here("lecture1", "ligue1.csv"))
```

#### 2.2. Classes

 * To know everything:

&lt;p style = "margin-bottom:.5cm;"&gt;&lt;/p&gt;

&lt;center&gt;&lt;b&gt;Class conversion table:&lt;/b&gt;&lt;/center&gt;



&lt;table class="table table-hover table-condensed" style="width: auto !important; margin-left: auto; margin-right: auto;"&gt;
&lt;caption&gt;&lt;/caption&gt;
 &lt;thead&gt;
  &lt;tr&gt;
   &lt;th style="text-align:left;"&gt;   &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; numeric &lt;/th&gt;
   &lt;th style="text-align:center;"&gt; character &lt;/th&gt;

 &lt;/thead&gt;

  &lt;tr&gt;

   &lt;td style="text-align:center;"&gt; Converts strings of numbers &lt;br&gt; into numeric values &lt;p style="margin-bottom:-.25cm;"&gt;&lt;/p&gt; Returns NA if characters in the string &lt;/td&gt;
   &lt;td style="text-align:center;"&gt; Returns 1 if TRUE  &lt;p style="margin-bottom:-.25cm;"&gt;&lt;/p&gt; Returns 0 if FALSE &lt;/td&gt;
  &lt;/tr&gt;
  &lt;tr&gt;
   &lt;td style="text-align:left;"&gt; &lt;b&gt;as.character()&lt;/b&gt; &lt;/td&gt;

   &lt;td style="text-align:center;"&gt; No effect &lt;/td&gt;
  &lt;/tr&gt;
&lt;/tbody&gt;

### 2. Anatomy of a `data.frame`

#### 2.3. Vectors

&lt;ul&gt;
  &lt;li&gt;We call these objects &lt;b&gt;vectors&lt;/b&gt;&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;Vectors are basically &lt;b&gt;sequences of values that have the same class&lt;/b&gt;&lt;/li&gt;
    &lt;li&gt;R won't let you create a vector containing elements of different classes&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;


&lt;p style = "margin-bottom:1.25cm;"&gt;&lt;/p&gt;


--

 * We make our own vectors using the **`c()`oncatenate** function
 
--


``` r
c("Hello world", 35, FALSE)
```

```
## [1] "Hello world" "35"          "FALSE"
```


&lt;p style = "margin-bottom:1.25cm;"&gt;&lt;/p&gt;


--

&lt;ul&gt;
  &lt;li&gt;The fact that vectors are homogeneous in class allows that &lt;b&gt;operations apply to all their elements&lt;/b&gt;&lt;/li&gt;
&lt;/ul&gt;

--


&lt;p style = "margin-bottom:-.5cm;"&gt;&lt;/p&gt;


.pull-left[

``` r
c(1, 2, 3) / 3
```

```
## [1] 0.3333333 0.6666667 1.0000000
```
]

--

.pull-right[

``` r
3 / c(1, 2, 3)
```

```
## [1] 3.0 1.5 1.0
```
]

### 2. Anatomy of a `data.frame`

#### 2.4. Subsetting

&lt;ul&gt;
  &lt;li&gt;But &lt;b&gt;$&lt;/b&gt; is not the only way to &lt;b&gt;extract&lt;/b&gt; a variable from a dataset&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;You can also make use of the &lt;b&gt;[ ]&lt;/b&gt; subsetting operator&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;

--

&lt;p style = "margin-bottom:1cm;"&gt;&lt;/p&gt;

$$\text{data}[\text{row}, \:\:\text{columns}] $$

--

&lt;ul&gt;
  &lt;li&gt;Inside the &lt;b&gt;brackets&lt;/b&gt;, indicate what you want to &lt;b&gt;keep using:&lt;/b&gt;&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;Indices:&lt;/b&gt; e.g., the third column has index 3&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Logical:&lt;/b&gt; A vector of TRUE and FALSE&lt;/li&gt;
    &lt;li&gt;&lt;b&gt;Names:&lt;/b&gt; They must be in quotation marks&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;

&lt;p style = "margin-bottom:0cm;"&gt;&lt;/p&gt;

--

.pull-left[

 * Example:


``` r
fb[1, c("Venue", "Attendance")]
```

```
##             Venue Attendance
## 1 Stade Louis II.       7500
```
]

--

.pull-right[

 * Brackets also work for vectors:
 

``` r
vec &lt;- c(3, 2, 1)
vec[c(T, F, T)]
```

```
## [1] 3 1
```
]

### 3. The `dplyr` package

#### 3.1. Basic functions


`dplyr` is a **grammar** of data manipulation providing very **user-friendly functions** to handle the most common **data manipulation** tasks:

--

 * `mutate()`: add/modify variables
 * `select()`: keep/drop variables (columns)
 * `filter()`: keep/drop observations (rows)
 * `arrange()`: sort rows according to the values of given variable(s)
 * `summarise()`: aggregate the data into descriptive statistics

--

&lt;p style = "margin-bottom:1cm;"&gt;&lt;/p&gt;

&lt;img src = "slides_elements/figures/pipe.png" width = "180"/&gt;

--


&lt;p style = "margin-bottom:-5cm;"&gt;&lt;/p&gt;

&lt;ul style = "margin-left:6cm;"&gt;
  &lt;li&gt;A very handy &lt;b&gt;operator&lt;/b&gt; to use with the &lt;b&gt;dplyr&lt;/b&gt; grammar is the &lt;b&gt;pipe %&gt;%&lt;/b&gt;&lt;/li&gt;
&lt;/ul&gt;

&lt;p style = "margin-bottom:-.25cm;"&gt;

&lt;ul style = "margin-left:6cm;"&gt;
  &lt;ul&gt;
    &lt;li&gt;You can basically read &lt;b&gt;a %&gt;% b()&lt;/b&gt; as &lt;i&gt;"apply function b() to object a"&lt;/i&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;

&lt;p style = "margin-bottom:-.25cm;"&gt;


&lt;ul style = "margin-left:6cm;"&gt;
  &lt;ul&gt;
    &lt;li&gt;With this operator you can easily &lt;b&gt;chain the operations&lt;/b&gt; you apply to an object&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;

### 3. The `dplyr` package

#### 3.1. Basic functions

### 3. The `dplyr` grammar

#### 3.3. group_by() and summarise()

&lt;ul&gt;
  &lt;li&gt;It is particularly &lt;b&gt;useful with summarise()&lt;/b&gt;&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;summarise keeps the grouping variable&lt;/li&gt;
    &lt;li&gt;and computes &lt;b&gt;statistics for each category&lt;/b&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;

--

.pull-left[


``` r
fb %&gt;%
  group_by(Wk) %&gt;%
  summarise(n = n(),
            tot_xG = sum(xG)+sum(xG.1),
            avg_WG = tot_xG/n) %&gt;%
  head(4)
```

```
## # A tibble: 4 × 4
##      Wk     n tot_xG avg_WG
##   &lt;int&gt; &lt;int&gt;  &lt;dbl&gt;  &lt;dbl&gt;
## 1     1    10   23.4   2.34
## 2     2    10   26.6   2.66
## 3     3    10   25.7   2.57
## 4     4    10   30.4   3.04
```


]

--


.pull-right[

&lt;p style = "margin-top:-6.3em"&gt;&lt;/p&gt;

&lt;center&gt;&lt;b&gt;mutate() \(\neq\) summarise()&lt;/b&gt;&lt;/center&gt;

&lt;ul&gt;
  &lt;li&gt;&lt;b&gt;mutate()&lt;/b&gt; takes an operation that converts:&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;A vector into another vector&lt;/b&gt;&lt;/li&gt;
  &lt;/ul&gt;
  &lt;li&gt;&lt;b&gt;summarise()&lt;/b&gt; takes an operation that converts:&lt;/li&gt;
  &lt;ul&gt;
    &lt;li&gt;&lt;b&gt;A vector into a value&lt;/b&gt;&lt;/li&gt;
  &lt;/ul&gt;
&lt;/ul&gt;
]

--


.pull-right[

&lt;p style = "margin-top:-15.5em"&gt;&lt;/p&gt;

&lt;center&gt;&lt;b&gt;Ungrouping&lt;/b&gt;&lt;/center&gt;

&lt;ul&gt;
  &lt;li&gt;&lt;b&gt;group_by()&lt;/b&gt; applies to all subsequent operations&lt;/li&gt;
  &lt;li&gt;To cancel its effect you must &lt;b&gt;ungroup()&lt;/b&gt; the data&lt;/li&gt;
&lt;/ul&gt;


``` r
fb %&gt;% 
  group_by(Wk) %&gt;% 
  mutate(test = mean(xG)) %&gt;% 
* ungroup() %&gt;%
  ...
```
]

### Solution

#### 5) Use `group_by()` and `summarise() `to compute the percentage of draws, home wins and away wins

--


``` r
fb %&gt;% 
  select(Home, Score, Away) %&gt;% 
  separate(Score, c("home_score", "away_score"), "-") %&gt;%
  mutate(home_score = as.numeric(home_score),
         away_score = as.numeric(away_score),
         winner = case_when(home_score &lt; away_score ~ "Away",
                            home_score == away_score ~ "Draw",
                            home_score &gt; away_score ~ "Home")) %&gt;%
* group_by(winner) %&gt;%
* summarise(pct = 100 * (n() / nrow(fb)))
```
